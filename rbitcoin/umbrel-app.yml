releaseNotes: >-
  rbitcoin v0.8.0: schema 26 opens a 0.7 datadir in place; multi-peer initial
  block download keeps moving on ordinary connections; consensus checks now
  match Bitcoin Core where they used to disagree; peers and RPC fail closed
  under load; feerates use sigop-adjusted size; block filters and silent-payment
  tweaks build during IBD; wallet and Lightning setup guide (docs/wallets.md).


  Full notes: https://github.com/reardencode/rbitcoin/releases/tag/v0.8.0
