manifestVersion: 1.1
id: rbitcoin
implements:
  - electrs
category: bitcoin
name: rbitcoin
version: "0.8.0"
tagline: A full Bitcoin node in Rust with a built-in Electrum server
description: >-
  Run your own full Bitcoin node — a standalone, pure-Rust implementation with
  multi-peer initial block download and a built-in Electrum server, Esplora API,
  and Bitcoin-Core-compatible RPC. Connect Electrum, Sparrow, Liana, Cake Wallet,
  BlueWallet, BitBox App, Envoy (Electrum), BDK and Alby Hub (Esplora), or
  Wasabi, LND, CLN (RPC) to your own node instead of a third-party server.


  rbitcoin is the node itself, not an Electrum server bolted onto the Bitcoin
  app — it does not depend on the Bitcoin (bitcoind) app. Initial block download
  takes days and the full-archive datadir grows beyond 700 GB, so run it on a
  machine with a large disk.


  Powered by rbitcoin from reardencode (Apache-2.0 / MIT).
